database.url=jdbc:mariadb://127.0.0.1:3306/minecraft?connectTimeout=3000&socketTimeout=5000
database.username=minecraft
# 운영 비밀번호는 이 파일보다 NICKNAME_DB_PASSWORD 환경 변수 사용을 권장합니다.
# 두 값이 모두 비어 있으면 플러그인은 인증 오류 원인을 명확히 로그로 남기고 시작하지 않습니다.
database.password=
database.password-env=NICKNAME_DB_PASSWORD
database.pool-size=6
nickname.min-length=2
nickname.max-length=16
nickname.blocked=관리자,운영자,admin,console
tab.refresh-milliseconds=1000
